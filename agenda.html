<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deva Aesthetic House - Agenda</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body data-page="agenda">

    <div id="navbar-placeholder"></div>

    <div class="container">
        <header class="header" style="border-bottom: none; padding-bottom: 0; margin-bottom: 20px;">
            <h2 style="font-size: 1.5rem; color: var(--deva-mauve);">Agenda de Pacientes</h2>
        </header>

        <section class="form-section filter-section">
            <div class="filter-group">
                <label for="filtroFecha">Citas del día:</label>
                <button id="btnAnterior" class="btn-secondary" type="button" aria-label="Día anterior">‹</button>
                <input type="date" id="filtroFecha">
                <button id="btnSiguiente" class="btn-secondary" type="button" aria-label="Día siguiente">›</button>
                <button id="btnHoy" class="btn-secondary" type="button">Ir a Hoy</button>
            </div>
            <div class="filter-group">
                <span><label for="filtroProf">Profesional:</label>
                    <select id="filtroProf" class="status-select"><option value="">Todos</option></select></span>
                <button id="btnNuevaCita" class="btn-primary" type="button" style="padding:8px 20px;">+ Nueva cita</button>
            </div>
            <div class="filter-stats" id="contadorCitas"></div>
        </section>

        <form id="nuevaCita" class="form-section nueva-cita" hidden>
            <h3 style="font-size:1.3rem;">Nueva cita</h3>
            <div id="ncMsg" class="alert" hidden role="alert"></div>
            <div class="grid-3">
                <div class="form-group"><label for="ncPaciente">Paciente</label><select id="ncPaciente"></select></div>
                <div class="form-group"><label for="ncServicio">Servicio</label><select id="ncServicio"></select></div>
                <div class="form-group"><label for="ncProfesional">Profesional</label><select id="ncProfesional"></select></div>
                <div class="form-group"><label for="ncBox">Box</label><select id="ncBox"></select></div>
                <div class="form-group"><label for="ncFecha">Fecha</label><input type="date" id="ncFecha" required></div>
                <div class="form-group"><label for="ncHora">Hora</label><input type="time" id="ncHora" required></div>
            </div>
            <div class="form-actions"><button type="submit" class="btn-primary">Agendar</button></div>
        </form>

        <section class="form-section">
            <div id="listaAgenda" class="agenda-list"></div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
