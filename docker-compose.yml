# Producción: aplicación + PostgreSQL (+ HTTPS opcional con Caddy).
#   1) cp .env.example .env   y complete los valores
#   2) docker compose up -d --build
#   3) (con dominio) docker compose --profile https up -d
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: deva
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD en .env}
      POSTGRES_DB: deva
      TZ: America/Santiago
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deva -d deva"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://deva:${DB_PASSWORD}@db:5432/deva
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET en .env}
      ADMIN_USER: ${ADMIN_USER:-sandra}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD en .env}
      PROFESIONAL_USER: ${PROFESIONAL_USER:-profesional}
      PROFESIONAL_PASSWORD: ${PROFESIONAL_PASSWORD:?Defina PROFESIONAL_PASSWORD en .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SEED_DEMO: ${SEED_DEMO:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    # Por defecto solo este computador; para otros equipos de la red use BIND=0.0.0.0 en .env
    ports: ["${BIND:-127.0.0.1}:${PUERTO:-3000}:3000"]

  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment: { DOMINIO: "${DOMINIO:-}" }
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  caddy_data:
  caddy_config:
